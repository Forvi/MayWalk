services:
# === infrastructure ===

  postgres:
    image: postgres:17-alpine
    profiles: ["dev", "prod"]
    container_name: maywalk-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER} 
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - maywalk_network
      - infrastructure

  redis:
    image: redis:7.4-alpine
    profiles: ["dev", "prod"]
    container_name: maywalk_cache
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --save 60 1 
      --appendonly yes 
      --appendfsync everysec 
      --maxmemory ${REDIS_MAXMEMORY:-256mb} 
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - maywalk_network
      - infrastructure

volumes:
  pgdata:
  redis_data:
    driver: local

networks:
  app:
  infrastructure:
  observability:
  maywalk_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16